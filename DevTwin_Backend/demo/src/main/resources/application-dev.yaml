server:
  port: ${SERVER_PORT:8900}

spring:
  application:
    name: developer-twin-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devtwin}
    username: ${DB_USERNAME:devtwin}
    password: ${DB_PASSWORD:devtwin}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

github:
  api:
    base-url: https://api.github.com
    version: 2026-03-10
    token: ${GITHUB_TOKEN:}
    low-rate-limit-threshold: 5
    stats-retries: 3
    stats-retry-delay: 1s
